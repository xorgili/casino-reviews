<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none">
  <defs>
    <linearGradient id="gold-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
  </defs>
  <!-- Casino Chip Icon -->
  <circle cx="30" cy="30" r="24" stroke="url(#chip-grad)" stroke-width="3" fill="none"/>
  <circle cx="30" cy="30" r="18" stroke="url(#chip-grad)" stroke-width="1.5" fill="none"/>
  <!-- Chip notches -->
  <rect x="28" y="4" width="4" height="8" rx="2" fill="#f0c040"/>
  <rect x="28" y="48" width="4" height="8" rx="2" fill="#00d4aa"/>
  <rect x="4" y="28" width="8" height="4" rx="2" fill="#f0c040"/>
  <rect x="48" y="28" width="8" height="4" rx="2" fill="#00d4aa"/>
  <!-- Chip diagonal notches -->
  <rect x="11" y="10" width="4" height="7" rx="2" fill="#f0c040" transform="rotate(45 13 13.5)"/>
  <rect x="45" y="43" width="4" height="7" rx="2" fill="#00d4aa" transform="rotate(45 47 46.5)"/>
  <rect x="45" y="10" width="4" height="7" rx="2" fill="#f0c040" transform="rotate(-45 47 13.5)"/>
  <rect x="11" y="43" width="4" height="7" rx="2" fill="#00d4aa" transform="rotate(-45 13 46.5)"/>
  <!-- Checkmark inside chip -->
  <polyline points="21,30 27,36 39,24" stroke="url(#gold-green)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Text: CasinoCheck -->
  <text x="68" y="25" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#e6edf3">Casino</text>
  <text x="68" y="48" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="url(#gold-green)">Check</text>
  <!-- Decorative dice dots -->
  <circle cx="195" cy="20" r="2" fill="#f0c040" opacity="0.6"/>
  <circle cx="205" cy="40" r="1.5" fill="#00d4aa" opacity="0.5"/>
</svg>